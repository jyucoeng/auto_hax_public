name: 🔄 Hax Auto Renew

on:
  # 仅由外部（cron-job.org）通过 workflow_dispatch 准点拉起，不依赖 GitHub 原生 schedule
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: Hax_Renew
      cancel-in-progress: false
    env:
      # 私有仓库（含 hus_create_vps.py / hus_config.txt 等）
      PRIVATE_REPO: jyucoeng/auto_hax
      PROJECT_DIR: hax
      # sing-box 代理（留空=直连）。monitor 模式下浏览器经 all_proxy 走该 SOCKS5
      PROXY_CONTENT: ${{ secrets.HAX_HY2_PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}
      # 抢机窗口相关（与 hus_config.txt 保持一致即可，仅用于控制本 workflow 运行时长）
      HUS_CRON_PREP_AHEAD_S: "240"
      HUS_CRON_WINDOW_S: "600"
      # 关闭频道监听，仅保留 HUS_CRON_TIMES 定时抢机
      HUS_DISABLE_CHANNEL: "1"
      SCREENSHOT_DIR: output/screenshots

    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 创建输出目录
        run: mkdir -p ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/requirements.txt

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium ffmpeg unzip curl wget jq ca-certificates \
            libnss3 libgbm1 libxkbcommon0 libgtk-3-0 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libxshmfence1

      - name: 安装 Python 依赖
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -q
          python3 -c 'import DrissionPage, telethon, requests; print("Python 依赖导入成功")'

      - name: 安装代理
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

          python3 gen_singbox_config.py > sing-box_config.json
          ./sing-box run -c sing-box_config.json > sing-box.log 2>&1 &
          sleep 3
          if python3 - <<PY
          import socket, sys
          p = int("${{ env.SOCKS_PORT }}")
          s = socket.socket(); s.settimeout(3)
          try:
            s.connect(("127.0.0.1", p)); print("ok")
          except Exception as e:
            print("fail", e); sys.exit(1)
          finally:
            s.close()
          PY
          then
            echo "[INFO] 代理就绪，导出 all_proxy 供浏览器使用"
            echo "all_proxy=socks5://127.0.0.1:${{ env.SOCKS_PORT }}" >> "$GITHUB_ENV"
            echo "http_proxy=socks5://127.0.0.1:${{ env.SOCKS_PORT }}" >> "$GITHUB_ENV"
            echo "https_proxy=socks5://127.0.0.1:${{ env.SOCKS_PORT }}" >> "$GITHUB_ENV"
          else
            echo "[WARN] 代理端口未就绪，回退直连"
          fi

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 60))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      - name: 执行创建（monitor 模式）
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          python3 -u hus_create_vps.py 2>&1 | tee hax.log &
          pid=$!
          duration=$(( ${HUS_CRON_PREP_AHEAD_S:-240} + ${HUS_CRON_WINDOW_S:-600} + 180 ))
          echo "计划运行 ${duration}s 后退出（覆盖预填+抢机窗口）"
          elapsed=0
          while kill -0 "$pid" 2>/dev/null; do
            if [ "$elapsed" -ge "$duration" ]; then
              echo "[INFO] 到达计划时长，终止创建进程"
              kill -TERM "$pid" 2>/dev/null || true
              break
            fi
            echo "[HEARTBEAT] 执行仍在运行: $(date -u +'%Y-%m-%dT%H:%M:%SZ') elapsed=${elapsed}s"
            sleep 15
            elapsed=$((elapsed + 15))
          done
          wait "$pid" 2>/dev/null || true

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hax-screenshots-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hax-log-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/hax.log
          retention-days: 7
          if-no-files-found: warn

      - name: 清理本地截图
        if: always()
        run: |
          SCREENSHOT_PATH="${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}"
          if [ -d "$SCREENSHOT_PATH" ]; then
            rm -rf "$SCREENSHOT_PATH"/*
            echo "本地截图已清理"
          fi

      - name: 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ${{ env.PROJECT_DIR }} && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ${{ env.PROJECT_DIR }}/time.txt
          git add ${{ env.PROJECT_DIR }}/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 7
          keep_minimum_runs: 5
