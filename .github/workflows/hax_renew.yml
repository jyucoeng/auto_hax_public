name: 🔄 Hax Auto Renew

on:
  # 仅由外部（cron-job.org）通过 workflow_dispatch 准点拉起，不依赖 GitHub 原生 schedule
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: Hax_Renew
      cancel-in-progress: false
    env:
      # ===== 仓库 / 路径 =====
      PRIVATE_REPO: jyucoeng/auto_hax          # 私有仓库（含 hus_create_vps.py 脚本），只读 checkout
      PROJECT_DIR: hax                         # 私有仓库检出到的子目录名（其余步骤据此拼接路径）

      # ===== 代理（可选，来自 Secret；留空=直连）=====
      # sing-box 代理源（hy2/vmess/trojan 等订阅或配置文本）。
      # 非空时脚本在运行时调用 gen_singbox_config.py 生成配置并启动本地 SOCKS5，
      # 浏览器(http) 与 TG 自动共用该出口；为空则全程直连。
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '50808' }}   # 本地 SOCKS5 端口（sing-box 监听），默认 50808

      # ===== 运行模式 =====
      HUS_MODE: monitor                        # monitor=定时抢机（按 HUS_CRON_TIMES 北京时间到点自动创建 VPS）

      # ===== 创建参数（非敏感，可按需调整）=====
      HUS_OS: Ubuntu 24                        # 默认操作系统（优先级低于 VPS_SPECS 指定的），如 Ubuntu 22/24、Debian 12
      HUS_DATACENTER: ""                       # 默认数据中心（留空=自动选第一个可用），优先级低于 VPS_SPECS 指定
      MAX_LOGIN_RETRIES: "1"                   # 登录失败最大重试次数
      DEBUG_FLAG: "0"                          # 调试模式（1=打印更多细节）
      HUS_HEADLESS: "false"                    # 浏览器是否无头（false=有头，GitHub Actions 用 Xvfb 虚拟屏）
      CHROME_PATH: ""                          # 浏览器路径；留空=自动探测。Linux 由「安装系统依赖」步骤自动设为 /usr/bin/google-chrome-stable；macOS 本机可填实际路径

      # ===== 抢机策略 =====
      VPS_REGIONS_WANT: US-OpenVZ-3,US-OpenVZ-2,EU-1   # 期望抢的区域白名单（逗号分隔，子串匹配、不区分大小写）；留空=不限区域

      # ===== 定时抢机（北京时间 UTC+8，HH:MM）=====
      # 注意：cron-job.org 只负责“唤醒”本工作流（到点调 dispatch），真正到点创建由脚本内置
      # 调度器按此值执行。所以本值必须与 cron-job.org 的触发时间点保持一致！
      # 建议 cron-job.org 在每个时间点前 ~5 分钟触发，给脚本留 HUS_CRON_PREP_AHEAD_S 预填时间。
      HUS_CRON_TIMES: 01:00,03:00,04:00,05:00,08:00,15:50,18:00,19:00,20:29   # 每天定时上线抢机的时间点（逗号分隔）
      HUS_CRON_WINDOW_S: "600"                 # 到点后持续抢机窗口（秒，默认10分钟）
      HUS_CRON_PREP_AHEAD_S: "240"             # 提前预选账号/区域时间（秒，需 < CF Turnstile token 有效期~300s）
      HUS_CRON_PREFILL_AHEAD_S: "180"          # 提前预填表单时间（秒，到点只点提交）；建议 180(3分钟)，< CF Turnstile token 有效期~300s

      # ===== 状态 / 目录 / 日志 =====
      REG_STATE_FILE: reg_state.json           # 抢机状态文件（记录已抢到的手机号；改路径可重置"已抢"标记）
      SCREENSHOT_DIR: output/screenshots       # 截图/调试图目录
      LOG_FILE: logs/hus_glab.log              # 日志文件名（实时写入，单文件不滚动）
      # 以下为创建后状态轮询（cron-monitor 创建时仍会用到）
      SCAN_TIMEOUT: "600"                      # 提交创建后轮询 VPS 状态最长等待（秒，等 ACTIVE/FAILED）
      PENDING_QUIET_SECONDS: "300"             # VPS 为 PENDING 时静默等待（秒）后再查一次状态
      NO_STOCK_REFRESH_S: "5"                  # DC 无库存时刷新创建页重新检查的间隔（秒）

      # ===== 账号 / TG 凭据（敏感，来自 GitHub Secrets，覆盖 hus_config.txt）=====
      # 格式：phone,tg_bot_token,tg_chat_id[,tg_api_id,tg_api_hash,tg_session]（分号分隔多账号）
      #   phone=HAX 登录手机号(+国家码-号码)；tg_bot_token=通知 Bot；tg_chat_id=接收通知的 ID
      #   tg_api_id/hash/session=可选（脚本已移除频道监听，一般无需填写；保留以兼容账号字段）
      HUS_BATCH: ${{ secrets.HUS_BATCH }}
      # 可选 VPS 规格：phone,datacenter,os（分号分隔多账号）；指定区域+系统优先于 HUS_DATACENTER/HUS_OS
      VPS_SPECS: ${{ secrets.HUS_VPS_SPECS }}
      # 可选：状态文件(reg_state.json) key 的加盐因子；设置了即使状态文件泄露也无法反解手机号。
      # 本地用 sha256_encode.py 查看时需提供同一盐（建议放在 hus_config.txt 或环境变量，勿提交明文）
      HUS_STATE_SALT: ${{ secrets.HUS_STATE_SALT }}

    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 创建输出目录
        run: mkdir -p ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/requirements.txt

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip curl wget jq ca-certificates \
            libnss3 libgbm1 libxkbcommon0 libgtk-3-0 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libxshmfence1
          # 安装 Google Chrome stable（snap 版 chromium 在 Actions 容器内不稳定，换官方 deb）
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            wget -qO /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/google-chrome.deb
            rm -f /tmp/google-chrome.deb
          fi
          # 优先用真实二进制绝对路径（避免 wrapper 解析问题）
          # Google Chrome deb 的真实 ELF 二进制是 /opt/google/chrome/chrome（google-chrome/google-chrome-stable 均为 wrapper）
          if [ -x /opt/google/chrome/chrome ]; then
            echo "CHROME_PATH=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
          elif [ -x /opt/google/chrome/google-chrome ]; then
            echo "CHROME_PATH=/opt/google/chrome/google-chrome" >> "$GITHUB_ENV"
          else
            echo "CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          fi
          google-chrome-stable --version

      - name: 安装 Python 依赖
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -q
          python3 -c 'import DrissionPage, telethon, requests; print("Python 依赖导入成功")'

      - name: 安装代理（sing-box 二进制）
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置 PROXY_CONTENT，直连模式（跳过 sing-box）"
            exit 0
          fi
          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"
          echo "[INFO] 启动/接入由脚本在运行时根据 PROXY_CONTENT 自行决定（直连或代理）"

      - name: 执行创建（monitor 模式）
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          python3 -u hus_create_vps.py 2>&1 | tee hax.log &
          pid=$!
          duration=$(( ${HUS_CRON_PREP_AHEAD_S:-240} + ${HUS_CRON_WINDOW_S:-600} + 180 ))
          echo "计划运行 ${duration}s 后退出（覆盖预填+抢机窗口）"
          elapsed=0
          while kill -0 "$pid" 2>/dev/null; do
            if [ "$elapsed" -ge "$duration" ]; then
              echo "[INFO] 到达计划时长，终止创建进程"
              kill -TERM "$pid" 2>/dev/null || true
              break
            fi
            echo "[HEARTBEAT] 执行仍在运行: $(date -u +'%Y-%m-%dT%H:%M:%SZ') elapsed=${elapsed}s"
            sleep 15
            elapsed=$((elapsed + 15))
          done
          wait "$pid" 2>/dev/null || true

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hax-screenshots-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hax-log-${{ github.run_id }}
          path: |
            ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/hax.log
            ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/logs/
            ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/sing-box.log
            ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/reg_state.json
          retention-days: 7
          if-no-files-found: warn

      - name: 清理本地截图
        if: always()
        run: |
          SCREENSHOT_PATH="${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}"
          if [ -d "$SCREENSHOT_PATH" ]; then
            rm -rf "$SCREENSHOT_PATH"/*
            echo "本地截图已清理"
          fi

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 7
          keep_minimum_runs: 5
