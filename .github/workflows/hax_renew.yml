name: 🔄 Hax Auto Renew

on:
  # 仅由外部（cron-job.org）通过 workflow_dispatch 准点拉起，不依赖 GitHub 原生 schedule
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: Hax_Renew
      cancel-in-progress: false
    env:
      # ===== 仓库 / 路径 =====
      PRIVATE_REPO: jyucoeng/auto_hax
      PROJECT_DIR: hax
      # sing-box 代理（留空=直连）。monitor 模式下浏览器经 all_proxy 走该 SOCKS5
      PROXY_CONTENT: ${{ secrets.HAX_HY2_PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}

      # ===== 运行模式 =====
      HUS_MODE: monitor
      HUS_DISABLE_CHANNEL: "1"
      HAX_MONITOR_CHANNEL: haxMonitor

      # ===== 创建参数（非敏感，可按需调整）=====
      HUS_OS: Ubuntu 24
      HUS_DATACENTER: ""
      HUS_MAX_WORKERS: "3"
      MAX_CREATE_RETRIES: "1"
      MAX_LOGIN_RETRIES: "1"
      DEBUG_FLAG: "0"
      HUS_HEADLESS: "false"
      # Linux 上留空让脚本自动探测系统 chromium（macOS 本机再填实际路径）
      CHROME_PATH: ""

      # ===== 抢机策略 =====
      VPS_REGIONS_WANT: US-OpenVZ-3,US-OpenVZ-2,EU-1

      # ===== 定时抢机（北京时间 UTC+8）=====
      HUS_CRON_TIMES: 01:00,03:00,04:00,05:00,08:00,18:00,19:00,20:29
      HUS_CRON_WINDOW_S: "600"
      HUS_CRON_PREP_AHEAD_S: "240"
      HUS_CRON_PREFILL_AHEAD_S: "90"

      # ===== 状态 / 目录 / 日志 =====
      REG_STATE_FILE: reg_state.json
      SCREENSHOT_DIR: output/screenshots
      MONITOR_DIR: output/monitor
      LOG_FILE: logs/hus_glab.log
      LOG_KEEP: "30"
      STOCK_KEYWORDS: 库存通知,hax库存通知
      STOCK_GRAB_WINDOW_S: "600"
      SCAN_TIMEOUT: "600"
      PENDING_QUIET_SECONDS: "300"
      POLL_INTERVAL: "120"
      NO_STOCK_REFRESH_S: "5"

      # ===== 账号 / TG 凭据（敏感，来自 GitHub Secrets，覆盖 hus_config.txt）=====
      # TG 用户会话凭据（api_id/hash/session）直接放在 HUS_BATCH 每账号的第 4~6 项，无需单独 Secret
      HUS_BATCH: ${{ secrets.HUS_BATCH }}
      VPS_SPECS: ${{ secrets.HUS_VPS_SPECS }}

    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 创建输出目录
        run: mkdir -p ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/requirements.txt

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium ffmpeg unzip curl wget jq ca-certificates \
            libnss3 libgbm1 libxkbcommon0 libgtk-3-0 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libxshmfence1

      - name: 安装 Python 依赖
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -q
          python3 -c 'import DrissionPage, telethon, requests; print("Python 依赖导入成功")'

      - name: 安装代理（sing-box）
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置 PROXY_CONTENT，直连模式（跳过 sing-box）"
            exit 0
          fi
          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"
          python3 gen_singbox_config.py > sing-box_config.json
          echo "[INFO] 已生成 sing-box_config.json（本地 SOCKS5 端口 ${{ env.SOCKS_PORT }}）"

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 60))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      - name: 执行创建（monitor 模式）
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          SB_PID=""
          if [ -n "$PROXY_CONTENT" ]; then
            echo "[INFO] 启动 sing-box 本地 SOCKS5 代理（端口 ${{ env.SOCKS_PORT }}）"
            nohup ./sing-box run -c sing-box_config.json > sing-box.log 2>&1 &
            SB_PID=$!
            sleep 4
            export all_proxy="socks5://127.0.0.1:${{ env.SOCKS_PORT }}"
            export http_proxy="socks5://127.0.0.1:${{ env.SOCKS_PORT }}"
            export https_proxy="socks5://127.0.0.1:${{ env.SOCKS_PORT }}"
            export TG_PROXY="socks5://127.0.0.1:${{ env.SOCKS_PORT }}"
            echo "[INFO] 代理已导出：浏览器(http) 与 TG 均走 $all_proxy"
          else
            echo "[INFO] 未配置 PROXY_CONTENT，直连模式"
          fi
          python3 -u hus_create_vps.py 2>&1 | tee hax.log &
          pid=$!
          duration=$(( ${HUS_CRON_PREP_AHEAD_S:-240} + ${HUS_CRON_WINDOW_S:-600} + 180 ))
          echo "计划运行 ${duration}s 后退出（覆盖预填+抢机窗口）"
          elapsed=0
          while kill -0 "$pid" 2>/dev/null; do
            if [ "$elapsed" -ge "$duration" ]; then
              echo "[INFO] 到达计划时长，终止创建进程"
              kill -TERM "$pid" 2>/dev/null || true
              break
            fi
            echo "[HEARTBEAT] 执行仍在运行: $(date -u +'%Y-%m-%dT%H:%M:%SZ') elapsed=${elapsed}s"
            sleep 15
            elapsed=$((elapsed + 15))
          done
          wait "$pid" 2>/dev/null || true
          if [ -n "$SB_PID" ]; then kill "$SB_PID" 2>/dev/null || true; fi

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hax-screenshots-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hax-log-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/hax.log
          retention-days: 7
          if-no-files-found: warn

      - name: 清理本地截图
        if: always()
        run: |
          SCREENSHOT_PATH="${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}"
          if [ -d "$SCREENSHOT_PATH" ]; then
            rm -rf "$SCREENSHOT_PATH"/*
            echo "本地截图已清理"
          fi

      - name: 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ${{ env.PROJECT_DIR }} && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ${{ env.PROJECT_DIR }}/time.txt
          git add ${{ env.PROJECT_DIR }}/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 7
          keep_minimum_runs: 5
